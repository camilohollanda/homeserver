#cloud-config
# Minimal OS prep only.
# Full AI services installation is handled by bootstrap/ai/setup.sh (runs locally).
# Requires: debian-12-nvidia template (NVIDIA drivers pre-installed in template).

hostname: ai-gpu
manage_etc_hosts: true

package_update: true
package_upgrade: false

packages:
  - curl
  - ca-certificates
  - gnupg

users:
  - default
  - name: ai
    groups: [sudo, video, render]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
