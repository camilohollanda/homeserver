apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miora
  namespace: miora-staging
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  # Public TLS terminates at Cloudflare; the tunnel reaches nginx over HTTP.
  rules:
  - host: staging.miora.now
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: miora
            port:
              number: 4000
