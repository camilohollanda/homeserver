apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: iddh-members-staging
  name: iddh-members
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iddh-members
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: iddh-members
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      containers:
      - name: iddh-members
        image: ghcr.io/iddh-com-br/members:staging
        ports:
        - containerPort: 4000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        env:
        - name: DNS_CLUSTER_QUERY
          value: cluster.iddh-members-staging.svc.cluster.local
        envFrom:
        - secretRef:
            name: secrets

        resources:
          # Staging and production run the same binary and their memory floor is
          # the runtime, not the traffic: both idle around 390-400 MiB. Keep the
          # two identical so staging cannot die of a ceiling production does not
          # have -- production has been seen at 586 MiB, above staging's whole
          # former 512Mi limit. The request tracks that floor; at 128/256Mi it
          # told the scheduler a 400 MiB pod fits anywhere.
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # A deploy races the ingress: EndpointSlice removal and SIGTERM are
        # concurrent and unordered, so when SIGTERM makes Phoenix drain its
        # LiveView sockets (WS close 1012), ingress-nginx may still be routing
        # here. The browser retries 10ms after that close — far faster than the
        # ingress reacts — lands on the dying pod and gets a 502. That 502 pushes
        # the socket onto its longpoll fallback (this app sets
        # longPollFallbackMs: 2500), where it wedges: no further connect attempt,
        # ever, so the page looks frozen until a manual reload. Sleeping before
        # SIGTERM lets the endpoint removal land first. Measured on werify, which
        # has the same shape: recovery went from never to 700ms.
        lifecycle:
          preStop:
            sleep:
              seconds: 10
      # Covers preStop (10s) *plus* the BEAM shutdown after SIGTERM. The implicit
      # 30s default would leave only 20s to drain.
      terminationGracePeriodSeconds: 45

---
apiVersion: v1
kind: Service
metadata:
  name: iddh-members
  namespace: iddh-members-staging
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: iddh-members
---
apiVersion: v1
kind: Service
metadata:
  name: cluster
  namespace: iddh-members-staging
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: iddh-members
