# Pull secret for the Forgejo container registry, alongside the GHCR one.
#
# Both exist at the same time on purpose: the workloads in this namespace keep
# pulling from ghcr.io until an app is switched over, and the switch is
# reversible. A missing pull secret is one of the preflight failures that
# bootstrap/forgejo/switch-argo-source.sh refuses to proceed past.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-credentials
  namespace: werify-staging
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: forgejo
    kind: ClusterSecretStore
  target:
    name: forgejo-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "forgejo.internal.prakash.com.br": {
                "username": "{{ .FORGEJO_REGISTRY_USER }}",
                "password": "{{ .FORGEJO_REGISTRY_TOKEN }}",
                "auth": "{{ printf "%s:%s" .FORGEJO_REGISTRY_USER .FORGEJO_REGISTRY_TOKEN | b64enc }}"
              }
            }
          }
  data:
    - secretKey: FORGEJO_REGISTRY_USER
      remoteRef:
        key: FORGEJO_REGISTRY_USER
    - secretKey: FORGEJO_REGISTRY_TOKEN
      remoteRef:
        key: FORGEJO_REGISTRY_TOKEN
