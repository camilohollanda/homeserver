apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: werify-staging
  name: werify
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: werify
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: werify
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: werify
          image: ghcr.io/prem-prakash/werify:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
          startupProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 3
          env:
            - name: DNS_CLUSTER_QUERY
              value: cluster.werify-staging.svc.cluster.local
          envFrom:
            - secretRef:
                name: secrets
          volumeMounts:
            - name: data
              mountPath: /app/priv
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: werify-data
---
apiVersion: v1
kind: Service
metadata:
  name: werify
  namespace: werify-staging
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: werify
---
apiVersion: v1
kind: Service
metadata:
  name: cluster
  namespace: werify-staging
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
  selector:
    app: werify
