apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The connector Deployment plus its own ExternalSecret. The werify-staging app owns the
# namespace and the ghcr-credentials secret; this app owns the connector and the
# `connector-secrets` it consumes, which is scoped to the Infisical path /WerifyConnector/
# rather than the app's /Werify/.
resources:
  - external-secret.yaml
  - connector-deployment.yaml
