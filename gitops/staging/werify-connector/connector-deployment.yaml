# WhatsApp connector, split into its own pod (Phase 2 of docs/whatsapp-connector-pod-split.md in
# the werify repo). Same image as the app — the Go binary ships at /app/bin/whatsapp-sidecar — run
# with a different command and SIDECAR_MODE=db, so it talks to the app over the whatsapp_events /
# whatsapp_commands tables + LISTEN/NOTIFY instead of a BEAM Port.
#
# Why a separate Deployment (and a separate ArgoCD Application, not tracked by image-updater):
# argocd-image-updater rewrites the werify image tag for the werify-staging app on every staging
# build, which would restart this connector too if it lived in that app. Keeping it in its own
# app — whose manifest doesn't change on app deploys — is exactly what stops the ~per-deploy
# connector reconnects that trip WhatsApp's anti-automation enforcement.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: werify-staging
  name: werify-connector
  # Deliberately NO reloader.stakater.com/auto: a secret rotation must not restart the connector
  # (decoupling it from that churn is the point). Roll it manually when its config truly changes:
  #   kubectl rollout restart deployment/werify-connector -n werify-staging
spec:
  replicas: 1
  # The whatsmeow companion session is single-owner (one active socket per device), so two
  # connector pods must never run at once. Recreate terminates the old pod before starting the new
  # — unlike the app's RollingUpdate, which would briefly run two that fight over the socket.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: werify-connector
  template:
    metadata:
      labels:
        app: werify-connector
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
        - name: forgejo-credentials
      containers:
        - name: connector
          # Dedicated :connector-staging tag, moved only by a deliberate promote (the "Deploy
          # WhatsApp connector" workflow in the werify repo re-points it at a chosen build).
          # image-updater digest-tracks this tag (its CR entry) and rolls the pod when the digest
          # changes — so a promote auto-deploys, no kubectl. App builds move :staging, never
          # :connector-staging, so merges never touch it. image-updater pins the resolved digest,
          # so an involuntary restart re-pulls the SAME image, never jumps to latest staging.
          image: ghcr.io/prem-prakash/werify:connector-staging
          imagePullPolicy: Always
          command: ["/app/bin/whatsapp-sidecar"]
          env:
            - name: SIDECAR_MODE
              value: "db"
            # Structured JSON logs to stdout, so Loki collects them for the werify-connector-staging
            # Grafana dashboard (the connector's default is "auto" — json off a TTY anyway, but pin
            # it so the dashboard's `| json` + level parsing can't be broken by an env flip).
            - name: SIDECAR_LOG_FORMAT
              value: json
            - name: SIDECAR_LOG_LEVEL
              value: info
            # Socket-free liveness signal: the connector rewrites this file every ~10s; the probe
            # below restarts the pod if it goes stale (the hard-wedge case k8s must catch, since a
            # wedged connector won't drain the recycle command either).
            - name: WHATSAPP_SIDECAR_HEARTBEAT_FILE
              value: /run/whatsapp-connector/heartbeat
          envFrom:
            # The connector's OWN secret (external-secret.yaml → Infisical /WerifyConnector/), not
            # the app's `secrets`. Carries SIDECAR_DATABASE_URL, WHATSAPP_SIDECAR_ALLOWLIST,
            # WHATSAPP_MEDIA_RETRY_RECEIPT_INTERVAL_MS, ENVIRONMENT and SIDECAR_SENTRY_DSN — and
            # nothing else, so this pod no longer holds the app's Asaas / OpenAI /
            # signing-certificate credentials. SIDECAR_MODE above still overrides any value the
            # secret carries (env wins over envFrom).
            #
            # WHATSAPP_SIDECAR_ALLOWLIST is the one to watch: it is deny-by-default, so if it goes
            # missing the connector does not crash — it goes inert (no reconnect, no capture) while
            # the heartbeat keeps the liveness probe green. Verify the key is present in the new
            # secret before rolling, not after.
            - secretRef:
                name: connector-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test $(( $(date +%s) - $(stat -c %Y /run/whatsapp-connector/heartbeat) )) -lt 30"
            # The heartbeat starts only after boot adoption (reconnectAll) finishes; give that room
            # so a healthy-but-slow boot isn't killed. A boot that actually hangs never writes it,
            # so it's restarted after the delay — which is the desired recovery.
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: heartbeat
              mountPath: /run/whatsapp-connector
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              # No Typst / PDF rendering here (that's the app) — just whatsmeow sockets, JSON, and
              # bounded in-memory caches during a history backfill. Far lighter than the app's 4Gi.
              memory: "512Mi"
              cpu: "1"
      volumes:
        - name: heartbeat
          emptyDir: {}
