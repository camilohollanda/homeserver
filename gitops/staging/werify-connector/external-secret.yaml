# The connector's own secret, scoped to the Infisical path "/WerifyConnector/" instead of the
# app's "/Werify/" — so this pod stops carrying ~60 credentials it never reads (see
# gitops/external-secrets/werify-connector-cluster-secret-store.yaml for why).
#
# Owned by the werify-connector-staging Application rather than werify-staging, which owns the
# app's `secrets` in this same namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: werify-connector-secrets
  namespace: werify-staging
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: werify-connector-staging
    kind: ClusterSecretStore
  target:
    name: connector-secrets
    creationPolicy: Owner
  # Same find-everything shape as the app's ExternalSecret: the Infisical *path* is the scope,
  # so which variables the connector gets is decided in Infisical, not duplicated here.
  dataFrom:
    - find:
        name:
          regexp: ".*"
