apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: apprise
  name: apprise
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apprise
  template:
    metadata:
      labels:
        app: apprise
    spec:
      containers:
      - name: apprise
        image: caronc/apprise:1.1.7
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: APPRISE_CONFIG_LOCK
          value: "yes"
        - name: APPRISE_STATEFUL_MODE
          value: "simple"
        # Constrain gunicorn workers (default scales with CPU count and OOMs)
        - name: APPRISE_WORKER_COUNT
          value: "2"
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        volumeMounts:
        - name: config
          mountPath: /config/homeserver.yml
          subPath: config.yml
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "20m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        secret:
          secretName: apprise-config
---
apiVersion: v1
kind: Service
metadata:
  name: apprise
  namespace: apprise
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: apprise
