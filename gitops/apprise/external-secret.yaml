apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # One URL per app-env tag, all pointing to the same Pushover
        # destination. Apprise filters by tag, so publishers' tag field must
        # match one of these. Add a new line per new app-env. To split a tag
        # off to a different sink (Discord, email, second Pushover app), edit
        # just that one URL.
        config.yml: |
          version: 1
          urls:
            - 'pover://{{ .user }}@{{ .token }}':
                tag: apps
            - 'pover://{{ .user }}@{{ .token }}':
                tag: cert-manager
            - 'pover://{{ .user }}@{{ .token }}':
                tag: grafana
            - 'pover://{{ .user }}@{{ .token }}':
                tag: loki
            - 'pover://{{ .user }}@{{ .token }}':
                tag: apprise
            - 'pover://{{ .user }}@{{ .token }}':
                tag: bugsink
            # werify + iddh-members get per-app icons via Pushover's
            # attachment_url (Apprise param: image_url). URLs are URL-encoded
            # so the inner `?` and `=` don't confuse Apprise's query parser.
            # If an attachment URL ever 404s Pushover silently drops the
            # image — the notification itself still fires.
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png':
                tag: werify-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png':
                tag: werify-staging
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png':
                tag: iddh-members-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png':
                tag: iddh-members-staging
  data:
    - secretKey: user
      remoteRef:
        key: PUSHOVER_USER_KEY
    - secretKey: token
      remoteRef:
        key: PUSHOVER_APP_TOKEN
