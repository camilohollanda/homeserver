apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Single Pushover URL: everything fans out here. The publishers' title
        # already carries the app-env identity (e.g. "Deployed: werify-prod" or
        # "[werify-production] error..."), so tag-based routing isn't needed
        # to disambiguate the destination — Pushover groups by application.
        # If you ever want per-tag splitting (different sounds, devices, or a
        # second sink like Discord), add tagged URLs below.
        config.yml: |
          version: 1
          urls:
            - 'pover://{{ .user }}@{{ .token }}'
  data:
    - secretKey: user
      remoteRef:
        key: PUSHOVER_USER_KEY
    - secretKey: token
      remoteRef:
        key: PUSHOVER_APP_TOKEN
