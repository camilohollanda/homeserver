apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Apprise reads /config/<key>/config.yml as the URL set for that key.
        # Single config key `homeserver`; one URL per app-env, tagged by name.
        # POST to /notify/homeserver?tag=<app-env> to route.
        config.yml: |
          version: 1
          urls:
            # ArgoCD deploy topics (one per Argo Application name)
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/apps':
                tag: apps
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/cert-manager':
                tag: cert-manager
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/grafana':
                tag: grafana
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/loki':
                tag: loki
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/ntfy':
                tag: ntfy
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/apprise':
                tag: apprise
            # Per app-env topics (deploys + Bugsink errors fan in here)
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/bugsink':
                tag: bugsink
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/werify-production':
                tag: werify-production
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/werify-staging':
                tag: werify-staging
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/iddh-members-production':
                tag: iddh-members-production
            - 'ntfy://publisher:{{ .password }}@ntfy.ntfy.svc.cluster.local:80/iddh-members-staging':
                tag: iddh-members-staging
  data:
    - secretKey: password
      remoteRef:
        key: NTFY_PUBLISHER_PASSWORD
