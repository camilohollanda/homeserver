apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # One URL per app-env tag, all pointing to the same Pushover
        # destination. Apprise filters by tag, so publishers' tag field must
        # match one of these. Add a new line per new app-env. To split a tag
        # off to a different sink (Discord, email, second Pushover app), edit
        # just that one URL.
        #
        # `?sound=<name>` picks the Pushover sound for that route. List of
        # built-in names: https://pushover.net/api#sounds. Sound mapping logic:
        #   bugle     — errors that need eyes (bugsink, OOM-kills)
        #   classical — config/secret rotations rolling pods (apprise tag)
        #   incoming  — actionable monitoring alerts (grafana, loki)
        #   magic     — routine FYI (cert-manager renewals)
        #   falling   — pod fell over but recovered (non-OOM restarts)
        #   none      — silent (staging non-OOM, so we're not woken at night)
        #   default   — generic catch-all
        config.yml: |
          version: 1
          urls:
            # Per-app icons in Pushover come from the *app token*, not any URL
            # param: the icon is uploaded once per Pushover application in the
            # dashboard and shown on every message from that app. It cannot be
            # set per-message (no image_url/attachment_url exists in Apprise's
            # Pushover plugin or Pushover's API). We therefore run three apps:
            #   .token       — "homeserver" (all infra tags + bugsink)
            #   .werifyToken — "werify"
            #   .iddhToken   — "iddh-members"
            #
            # All infra/system tags (plus bugsink) share the homeserver app,
            # so they show the generic homeserver icon.
            - 'pover://{{ .user }}@{{ .token }}':
                tag: apps
            - 'pover://{{ .user }}@{{ .token }}?sound=magic':
                tag: cert-manager
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: grafana
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: loki
            - 'pover://{{ .user }}@{{ .token }}?sound=classical':
                tag: apprise
            - 'pover://{{ .user }}@{{ .token }}?sound=bugle':
                tag: bugsink
            # werify + iddh-members route to their own Pushover apps so their
            # uploaded app icon shows instead of the generic homeserver one.
            #
            # Two tags per app-env: `<ns>` for routine restarts (falling,
            # silent in staging), and `oom-<ns>` for OOM-kills (bugle, loud
            # everywhere — staging OOM is the whole reason this route
            # exists, so it isn't silenced). pod-notify picks which tag to
            # use per event.
            - 'pover://{{ .user }}@{{ .werifyToken }}?sound=falling':
                tag: werify-production
            - 'pover://{{ .user }}@{{ .werifyToken }}?sound=none':
                tag: werify-staging
            - 'pover://{{ .user }}@{{ .werifyToken }}?sound=bugle':
                tag: oom-werify-production
            - 'pover://{{ .user }}@{{ .werifyToken }}?sound=bugle':
                tag: oom-werify-staging
            - 'pover://{{ .user }}@{{ .iddhToken }}?sound=falling':
                tag: iddh-members-production
            - 'pover://{{ .user }}@{{ .iddhToken }}?sound=none':
                tag: iddh-members-staging
            - 'pover://{{ .user }}@{{ .iddhToken }}?sound=bugle':
                tag: oom-iddh-members-production
            - 'pover://{{ .user }}@{{ .iddhToken }}?sound=bugle':
                tag: oom-iddh-members-staging
  data:
    - secretKey: user
      remoteRef:
        key: PUSHOVER_USER_KEY
    # "homeserver" Pushover app (infra tags + bugsink)
    - secretKey: token
      remoteRef:
        key: PUSHOVER_APP_TOKEN
    # "werify" Pushover app — its own uploaded icon
    - secretKey: werifyToken
      remoteRef:
        key: PUSHOVER_TOKEN_WERIFY
    # "iddh-members" Pushover app — its own uploaded icon
    - secretKey: iddhToken
      remoteRef:
        key: PUSHOVER_TOKEN_IDDH_MEMBERS
