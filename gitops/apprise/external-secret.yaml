apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # One URL per tag. Apprise filters by tag, so a publisher's `tag` field
        # must match one of these exactly — a POST carrying an unlisted tag
        # succeeds (204) but silently reaches nobody. Add a line per new tag.
        #
        # `?sound=<name>` picks the Pushover sound for that route. List of
        # built-in names: https://pushover.net/api#sounds. Sound mapping logic:
        #   bugle     — errors that need eyes (bugsink, OOM-kills)
        #   classical — config/secret rotations rolling pods
        #   incoming  — actionable monitoring alerts (grafana, loki)
        #   magic     — routine FYI (cert-manager renewals)
        #   falling   — pod fell over but recovered (non-OOM restarts)
        #   default   — generic catch-all
        #
        # Staging is deliberately *not* silenced here. Each env has its own
        # Pushover application, so quiet-hours/mute is a per-app toggle in the
        # Pushover client — no git push needed to stop being woken up.
        config.yml: |
          version: 1
          urls:
            # Per-app icons in Pushover come from the *app token*, not any URL
            # param: the icon is uploaded once per Pushover application in the
            # dashboard and shown on every message from that app. It cannot be
            # set per-message (no image_url/attachment_url exists in Apprise's
            # Pushover plugin or Pushover's API). Splitting by app *and* env
            # therefore means one Pushover application per app-env:
            #   .token              — "Homeserver"        (all infra tags)
            #   .werifyProdToken    — "Werify - Production"
            #   .werifyStagingToken — "Werify - Staging"
            #   .iddhProdToken      — "IDDH - Production"
            #   .iddhStagingToken   — "IDDH - Staging"
            #
            # Infra/system tags are single-env by nature and all share the
            # homeserver app, so they show the generic homeserver icon.
            - 'pover://{{ .user }}@{{ .token }}':
                tag: apps
            - 'pover://{{ .user }}@{{ .token }}?sound=magic':
                tag: cert-manager
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: grafana
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: loki
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: victoria-metrics
            - 'pover://{{ .user }}@{{ .token }}?sound=classical':
                tag: apprise
            - 'pover://{{ .user }}@{{ .token }}?sound=bugle':
                tag: bugsink
            # Per app-env, three tags — all routed to that env's own Pushover
            # application, so the message lands under "<App> - <Env>" in the
            # Applications list instead of being interleaved with the other env:
            #
            #   <ns>          Argo CD deploy/fail (tag = Application name, which
            #                 is already `<app>-<env>`) + pod-notify restarts +
            #                 Bugsink issues (the shim's /hook/<ns> path).
            #   oom-<ns>      pod-notify OOM-kills. Bugle everywhere — an OOM in
            #                 staging is exactly the thing we want to hear about.
            #   reload-<ns>   secret-notify: Reloader rolled the workload because
            #                 a Secret/ConfigMap it consumes changed.
            #
            # Adding an app-env means: a Pushover app + token in Infisical, a
            # data entry below, three lines here, and the namespace added to
            # pod-notify's NAMESPACES and secret-notify's APP_NAMESPACES.
            - 'pover://{{ .user }}@{{ .werifyProdToken }}?sound=falling':
                tag: werify-production
            - 'pover://{{ .user }}@{{ .werifyProdToken }}?sound=bugle':
                tag: oom-werify-production
            - 'pover://{{ .user }}@{{ .werifyProdToken }}?sound=classical':
                tag: reload-werify-production
            - 'pover://{{ .user }}@{{ .werifyStagingToken }}?sound=falling':
                tag: werify-staging
            - 'pover://{{ .user }}@{{ .werifyStagingToken }}?sound=bugle':
                tag: oom-werify-staging
            - 'pover://{{ .user }}@{{ .werifyStagingToken }}?sound=classical':
                tag: reload-werify-staging
            - 'pover://{{ .user }}@{{ .iddhProdToken }}?sound=falling':
                tag: iddh-members-production
            - 'pover://{{ .user }}@{{ .iddhProdToken }}?sound=bugle':
                tag: oom-iddh-members-production
            - 'pover://{{ .user }}@{{ .iddhProdToken }}?sound=classical':
                tag: reload-iddh-members-production
            - 'pover://{{ .user }}@{{ .iddhStagingToken }}?sound=falling':
                tag: iddh-members-staging
            - 'pover://{{ .user }}@{{ .iddhStagingToken }}?sound=bugle':
                tag: oom-iddh-members-staging
            - 'pover://{{ .user }}@{{ .iddhStagingToken }}?sound=classical':
                tag: reload-iddh-members-staging
  data:
    - secretKey: user
      remoteRef:
        key: PUSHOVER_USER_KEY
    # "Homeserver" Pushover app (infra tags)
    - secretKey: token
      remoteRef:
        key: PUSHOVER_APP_TOKEN
    # "Werify - Production" — the app formerly named just "Werify", renamed in
    # the Pushover dashboard, so the token (and its message history) is unchanged.
    - secretKey: werifyProdToken
      remoteRef:
        key: PUSHOVER_TOKEN_WERIFY
    # "Werify - Staging" — new Pushover app
    - secretKey: werifyStagingToken
      remoteRef:
        key: PUSHOVER_TOKEN_WERIFY_STAGING
    # "IDDH - Production" — formerly "IDDH", renamed; token unchanged.
    - secretKey: iddhProdToken
      remoteRef:
        key: PUSHOVER_TOKEN_IDDH_MEMBERS
    # "IDDH - Staging" — new Pushover app
    - secretKey: iddhStagingToken
      remoteRef:
        key: PUSHOVER_TOKEN_IDDH_MEMBERS_STAGING
