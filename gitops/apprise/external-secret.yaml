apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apprise-config
  namespace: apprise
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: apprise-config
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # One URL per app-env tag, all pointing to the same Pushover
        # destination. Apprise filters by tag, so publishers' tag field must
        # match one of these. Add a new line per new app-env. To split a tag
        # off to a different sink (Discord, email, second Pushover app), edit
        # just that one URL.
        #
        # `?sound=<name>` picks the Pushover sound for that route. List of
        # built-in names: https://pushover.net/api#sounds. Sound mapping logic:
        #   bugle     — errors that need eyes (bugsink, OOM-kills)
        #   classical — config/secret rotations rolling pods (apprise tag)
        #   incoming  — actionable monitoring alerts (grafana, loki)
        #   magic     — routine FYI (cert-manager renewals)
        #   falling   — pod fell over but recovered (non-OOM restarts)
        #   none      — silent (staging non-OOM, so we're not woken at night)
        #   default   — generic catch-all
        config.yml: |
          version: 1
          urls:
            - 'pover://{{ .user }}@{{ .token }}':
                tag: apps
            - 'pover://{{ .user }}@{{ .token }}?sound=magic':
                tag: cert-manager
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: grafana
            - 'pover://{{ .user }}@{{ .token }}?sound=incoming':
                tag: loki
            - 'pover://{{ .user }}@{{ .token }}?sound=classical':
                tag: apprise
            - 'pover://{{ .user }}@{{ .token }}?sound=bugle':
                tag: bugsink
            # werify + iddh-members get per-app icons via Pushover's
            # attachment_url (Apprise param: image_url). URLs are URL-encoded
            # so the inner `?` and `=` don't confuse Apprise's query parser.
            # If an attachment URL ever 404s Pushover silently drops the
            # image — the notification itself still fires.
            #
            # Two tags per app-env: `<ns>` for routine restarts (falling,
            # silent in staging), and `oom-<ns>` for OOM-kills (bugle, loud
            # everywhere — staging OOM is the whole reason this route
            # exists, so it isn't silenced). pod-notify picks which tag to
            # use per event.
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png&sound=falling':
                tag: werify-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png&sound=none':
                tag: werify-staging
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png&sound=bugle':
                tag: oom-werify-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fwerify.app%2Fapple-touch-icon.png&sound=bugle':
                tag: oom-werify-staging
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png&sound=falling':
                tag: iddh-members-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png&sound=none':
                tag: iddh-members-staging
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png&sound=bugle':
                tag: oom-iddh-members-production
            - 'pover://{{ .user }}@{{ .token }}?image_url=https%3A%2F%2Fmembros.iddh.com.br%2Ficon-192.png&sound=bugle':
                tag: oom-iddh-members-staging
  data:
    - secretKey: user
      remoteRef:
        key: PUSHOVER_USER_KEY
    - secretKey: token
      remoteRef:
        key: PUSHOVER_APP_TOKEN
