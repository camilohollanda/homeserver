---
# Watches Reloader-emitted Kubernetes events cluster-wide and posts a
# notification to the local Apprise instance. Reloader fires when a Secret or
# ConfigMap consumed by an annotated workload changes and it rolls the
# workload — so this fires when the new value is actually entering pods, not
# just when ESO wrote it to a Secret. Workloads without the Reloader
# annotation will not appear here (by design — no restart = no event).
#
# Routing: an event in one of $APP_NAMESPACES is tagged `reload-<ns>` so it
# lands in that app-env's own Pushover application; anything else (infra
# namespaces) falls back to $TAG and shows up under "Homeserver".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-notify
  namespace: apprise
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-notify
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-notify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-notify
subjects:
  - kind: ServiceAccount
    name: secret-notify
    namespace: apprise
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-notify
  namespace: apprise
data:
  watch.sh: |
    #!/bin/sh
    set -eu

    : "${APPRISE_URL:?must be set}"
    : "${TAG:?must be set}"
    : "${APP_NAMESPACES:=}"

    echo "watching Reloader events -> $APPRISE_URL (fallback tag=$TAG)"
    echo "per-app namespaces: ${APP_NAMESPACES:-<none>}"

    while true; do
      # No upstream field-selector for source.component, so we watch all
      # events and filter in jq. Cluster event volume is low; cheap enough.
      # --unbuffered is critical: without it jq holds output until EOF and
      # notifications never fire on a live watch stream.
      kubectl get events --all-namespaces --watch-only -o json \
        | jq -c --unbuffered --arg tag "$TAG" --arg apps "$APP_NAMESPACES" '
            # Reloader uses distinct sources per watched kind:
            # `reloader-secrets`, `reloader-configmaps`. Match by prefix.
            select(
              ((.source.component // "")     | ascii_downcase | startswith("reloader"))
              or ((.reportingComponent // "") | ascii_downcase | startswith("reloader"))
            )
            | (.involvedObject.namespace // "") as $ns
            | ($apps | split(" ") | map(select(length > 0))) as $applist
            | {
                title: "[\($ns)] pod reloaded (secret/configmap changed)",
                body:  "\(.involvedObject.kind) \($ns)/\(.involvedObject.name): \(.message)",
                # An app-env namespace routes to its own Pushover app; infra
                # namespaces fall back to the shared homeserver tag.
                tag:   (if ($applist | index($ns)) then "reload-\($ns)" else $tag end),
                type:  "info"
              }
          ' \
        | while IFS= read -r payload; do
            curl -fsS -X POST -H 'Content-Type: application/json' \
              -d "$payload" "$APPRISE_URL" \
              || echo "notify failed: $payload"
          done

      echo "watch ended, reconnecting in 5s..."
      sleep 5
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-notify
  namespace: apprise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: secret-notify
  template:
    metadata:
      labels:
        app: secret-notify
    spec:
      serviceAccountName: secret-notify
      containers:
        - name: watcher
          image: alpine/k8s:1.30.4
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - name: APPRISE_URL
              value: "http://apprise.apprise.svc.cluster.local/notify/homeserver"
            - name: TAG
              value: "apprise"
            # Keep in sync with pod-notify's NAMESPACES and the reload-<ns>
            # tags in gitops/apprise/external-secret.yaml.
            - name: APP_NAMESPACES
              value: "werify-production werify-staging iddh-members-production iddh-members-staging"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: scripts
          configMap:
            name: secret-notify
            defaultMode: 0755
