apiVersion: v1
kind: ConfigMap
metadata:
  name: notify-watcher-script
  namespace: argocd
data:
  watch.sh: |
    #!/bin/sh
    set -eu

    : "${APPRISE_URL:?APPRISE_URL required}"
    : "${APPRISE_KEY:=homeserver}"
    : "${ARGOCD_URL:=https://argocd.internal.prakash.com.br}"
    : "${INTERVAL:=30}"
    : "${TAG_FALLBACK:=apps}"

    ANNOTATION_KEY="ntfy-watcher.io/last-revision"
    TAG_ANNOTATION="ntfy-watcher.io/topic"

    log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }

    # Tag = app-env. Default: Application name (lower-cased, sanitized).
    # Override per-Application with annotation ntfy-watcher.io/topic.
    sanitize_tag() {
      printf '%s' "$1" | tr '[:upper:]' '[:lower:]' \
        | sed 's/[^a-z0-9_-]/-/g' | cut -c1-64
    }

    notify() {
      ns="$1" name="$2" rev="$3" cur="$4" health="$5" tag_override="$6"
      short=$(printf '%s' "$rev" | cut -c1-7)
      click="${ARGOCD_URL}/applications/${ns}/${name}"
      title="Deployed: ${name}"
      body=$(printf '%s synced to `%s` (%s)\n\n[View in ArgoCD](%s)' \
        "$name" "$short" "$health" "$click")

      if [ -n "${tag_override:-}" ]; then
        tag=$(sanitize_tag "$tag_override")
      else
        tag=$(sanitize_tag "$name")
      fi
      [ -z "$tag" ] && tag="$TAG_FALLBACK"

      payload=$(jq -n \
        --arg t "$title" --arg b "$body" --arg tag "$tag" \
        '{title:$t, body:$b, tag:$tag, type:"info", format:"markdown"}')

      if curl -fsS -X POST \
           -H 'Content-Type: application/json' \
           -d "$payload" \
           "${APPRISE_URL}/notify/${APPRISE_KEY}" >/dev/null; then
        kubectl annotate -n "${ns}" "application/${name}" \
          "${ANNOTATION_KEY}=${cur}" --overwrite >/dev/null
        log "notified ${ns}/${name} -> ${short} (tag=${tag})"
      else
        log "notify FAILED ${ns}/${name} -> ${short} tag=${tag} (will retry)"
      fi
    }

    log "watcher starting (apprise=${APPRISE_URL}/notify/${APPRISE_KEY}, interval=${INTERVAL}s)"

    while true; do
      kubectl get applications -A -o json 2>/dev/null \
        | jq -r --arg key "$ANNOTATION_KEY" --arg tkey "$TAG_ANNOTATION" '
            .items[]
            | select(.status.operationState.phase == "Succeeded")
            | select(.status.health.status == "Healthy")
            | . as $a
            | ($a.status.operationState.syncResult.revision // "") as $rev
            | (($a.status.summary.images // []) | sort | join(",")) as $imgs
            | ($rev + "|" + $imgs) as $cur
            | (($a.metadata.annotations // {})[$key] // "") as $last
            | (($a.metadata.annotations // {})[$tkey] // "") as $tag
            | select($rev != "" and $cur != $last)
            | [$a.metadata.namespace, $a.metadata.name, $rev, $cur, $a.status.health.status, $tag]
            | @tsv
          ' \
        | while IFS="$(printf '\t')" read -r ns name rev cur health tag_override; do
            [ -z "${name:-}" ] && continue
            notify "$ns" "$name" "$rev" "$cur" "$health" "$tag_override"
          done || log "tick failed (continuing)"
      sleep "$INTERVAL"
    done
