apiVersion: v1
kind: ConfigMap
metadata:
  name: notify-watcher-script
  namespace: argocd
data:
  watch.sh: |
    #!/bin/sh
    set -eu

    : "${NTFY_URL:=https://ntfy.prakash.com.br}"
    : "${NTFY_USER:?NTFY_USER required}"
    : "${NTFY_PASSWORD:?NTFY_PASSWORD required}"
    : "${ARGOCD_URL:=https://argocd.internal.prakash.com.br}"
    : "${INTERVAL:=30}"
    : "${TOPIC_FALLBACK:=argocd}"

    ANNOTATION_KEY="ntfy-watcher.io/last-revision"
    TOPIC_ANNOTATION="ntfy-watcher.io/topic"

    log() { echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"; }

    # Topic = app-env. Defaults to Application name (lower-cased, sanitized);
    # override per Application with annotation ntfy-watcher.io/topic.
    sanitize_topic() {
      printf '%s' "$1" | tr '[:upper:]' '[:lower:]' \
        | sed 's/[^a-z0-9_-]/-/g' | cut -c1-64
    }

    notify() {
      ns="$1" name="$2" rev="$3" health="$4" topic_override="$5"
      short=$(printf '%s' "$rev" | cut -c1-7)
      title="Deployed: ${name}"
      body="${name} synced to ${short} (${health})"
      click="${ARGOCD_URL}/applications/${ns}/${name}"
      if [ -n "${topic_override:-}" ]; then
        topic=$(sanitize_topic "$topic_override")
      else
        topic=$(sanitize_topic "$name")
      fi
      [ -z "$topic" ] && topic="$TOPIC_FALLBACK"
      if curl -fsS -X POST \
           -u "${NTFY_USER}:${NTFY_PASSWORD}" \
           -H "Title: ${title}" \
           -H "Tags: rocket" \
           -H "Priority: 3" \
           -H "Click: ${click}" \
           -d "${body}" \
           "${NTFY_URL}/${topic}" >/dev/null; then
        kubectl annotate -n "${ns}" "application/${name}" \
          "${ANNOTATION_KEY}=${rev}" --overwrite >/dev/null
        log "notified ${ns}/${name} -> ${short} (topic=${topic})"
      else
        log "notify FAILED ${ns}/${name} -> ${short} topic=${topic} (will retry)"
      fi
    }

    log "watcher starting (per-app topics, fallback=${TOPIC_FALLBACK}, interval=${INTERVAL}s)"

    while true; do
      kubectl get applications -A -o json 2>/dev/null \
        | jq -r --arg key "$ANNOTATION_KEY" --arg tkey "$TOPIC_ANNOTATION" '
            .items[]
            | select(.status.operationState.phase == "Succeeded")
            | select(.status.health.status == "Healthy")
            | . as $a
            | ($a.status.operationState.syncResult.revision // "") as $cur
            | (($a.metadata.annotations // {})[$key] // "") as $last
            | (($a.metadata.annotations // {})[$tkey] // "") as $topic
            | select($cur != "" and $cur != $last)
            | [$a.metadata.namespace, $a.metadata.name, $cur, $a.status.health.status, $topic]
            | @tsv
          ' \
        | while IFS="$(printf '\t')" read -r ns name rev health topic_override; do
            [ -z "${name:-}" ] && continue
            notify "$ns" "$name" "$rev" "$health" "$topic_override"
          done || log "tick failed (continuing)"
      sleep "$INTERVAL"
    done
