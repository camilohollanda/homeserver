apiVersion: v1
kind: ServiceAccount
metadata:
  name: notify-watcher
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notify-watcher
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notify-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: notify-watcher
subjects:
  - kind: ServiceAccount
    name: notify-watcher
    namespace: argocd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-watcher
  namespace: argocd
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notify-watcher
  template:
    metadata:
      labels:
        app: notify-watcher
    spec:
      serviceAccountName: notify-watcher
      containers:
        - name: watcher
          image: alpine/k8s:1.32.6
          command: ["/bin/sh", "/scripts/watch.sh"]
          env:
            - name: APPRISE_URL
              value: http://apprise.apprise.svc.cluster.local
            - name: APPRISE_KEY
              value: homeserver
            - name: ARGOCD_URL
              value: https://argocd.internal.prakash.com.br
            - name: INTERVAL
              value: "30"
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: script
          configMap:
            name: notify-watcher-script
            defaultMode: 0755
