apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Apprise sink. The path-bound key (`homeserver`) matches the Apprise
  # stateful config in `gitops/apprise/external-secret.yaml`; per-tag
  # Pushover URLs there route by the `tag` field in the JSON body below.
  service.webhook.apprise: |
    url: http://apprise.apprise.svc.cluster.local/notify/homeserver
    headers:
    - name: Content-Type
      value: application/json

  template.app-deployed: |
    webhook:
      apprise:
        method: POST
        body: |
          {
            "title": "Deployed: {{.app.metadata.name}}",
            "body": "{{.app.metadata.name}} synced to `{{trunc 7 .app.status.sync.revision}}` ({{.app.status.health.status}})\n\n[View in ArgoCD](https://argocd.internal.prakash.com.br/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}})",
            "tag": "{{.app.metadata.name}}",
            "type": "info",
            "format": "markdown"
          }

  template.app-failed: |
    webhook:
      apprise:
        method: POST
        body: |
          {
            "title": "FAILED: {{.app.metadata.name}}",
            "body": "{{.app.metadata.name}} — health=`{{.app.status.health.status}}` sync=`{{.app.status.sync.status}}` rev=`{{trunc 7 .app.status.sync.revision}}`\n{{range .app.status.conditions}}- **{{.type}}**: {{.message}}\n{{end}}\n[View in ArgoCD](https://argocd.internal.prakash.com.br/applications/{{.app.metadata.namespace}}/{{.app.metadata.name}})",
            "tag": "{{.app.metadata.name}}",
            "type": "failure",
            "format": "markdown"
          }

  # Fires once per kustomize image-override tuple. Deliberately *not* keyed
  # on app.status.sync.revision: that would re-fire for every app on every
  # gitops commit (since all apps share targetRevision: main), even when the
  # commit only touched an unrelated configmap. Keying on the image tuple
  # means we only ping when argocd-image-updater actually rotates a digest,
  # which is the event humans care about. Apps without kustomize images
  # (helm-only / umbrella / config-only) will fire once after this change
  # lands and then stay quiet — that's fine, manual gitops pushes don't
  # need a confirmation ping because the pusher already knows.
  #
  # The operationState != nil guard avoids a "cannot fetch phase from <nil>"
  # eval error for apps that have no operationState yet (e.g. the app-of-
  # apps umbrella before its first sync completes).
  trigger.on-deployed: |
    - description: Application is synced and healthy
      send: [app-deployed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy' and app.status.sync.status == 'Synced'
      oncePer: string(app.spec.source?.kustomize?.images)

  # Health-degraded covers the common "image updater bumped the digest, new
  # pod CrashLoopBackOff, rollout never reached Healthy" case — kubernetes
  # flips the Deployment to Degraded after progressDeadlineSeconds. oncePer
  # mirrors on-deployed so a flap-recover-flap on the same revision/image
  # only pings once.
  trigger.on-health-degraded: |
    - description: Application health became Degraded
      send: [app-failed]
      when: app.status.health.status == 'Degraded'
      oncePer: app.status.sync.revision + ',' + string(app.spec.source?.kustomize?.images)

  # Sync-failed covers the other half: manifest invalid, hook failed, the
  # sync operation itself errored before the workload ever started.
  trigger.on-sync-failed: |
    - description: Sync operation failed
      send: [app-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      oncePer: app.status.operationState.syncResult.revision

  # Default subscription — every Application notifies, no per-app
  # annotations required. Mirrors the old watcher's "notify everything"
  # behaviour. Each app's name must have a matching tag entry in the
  # Apprise config or the POST succeeds but routes to no Pushover URL.
  subscriptions: |
    - recipients:
      - apprise
      triggers:
      - on-deployed
      - on-health-degraded
      - on-sync-failed
