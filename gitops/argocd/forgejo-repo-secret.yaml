# Repository credential so Argo CD can clone from the Forgejo mirror.
#
# Adding this credential does NOT move any application. Every Application still
# points at github.com until bootstrap/forgejo/switch-argo-source.sh is run for
# it, one app at a time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-repo
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: forgejo-repo
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          # Argo CD only picks a Secret up as a repository credential when this
          # label is present.
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://forgejo.internal.prakash.com.br/camilohollanda/homeserver.git
        username: "{{ .FORGEJO_ARGO_USER }}"
        password: "{{ .FORGEJO_ARGO_TOKEN }}"
  data:
    - secretKey: FORGEJO_ARGO_USER
      remoteRef:
        key: FORGEJO_ARGO_USER
    - secretKey: FORGEJO_ARGO_TOKEN
      remoteRef:
        key: FORGEJO_ARGO_TOKEN
