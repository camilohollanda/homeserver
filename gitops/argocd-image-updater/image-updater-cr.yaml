# ImageUpdater CR to watch for new images and update ArgoCD Applications
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: werify-image-updater
  namespace: argocd
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: digest
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: "iddh-members-production"
      images:
        - alias: members
          # iddh-members CI mirrors werify: pushes immutable `main-<shortsha>`
          # tags. Track those so the deploy notification carries the commit.
          imageName: ghcr.io/iddh-com-br/members
          updateStrategy: latest
          allowTags: "^main-[0-9a-f]{7,}$"
    - namePattern: "werify-production"
      images:
        - alias: werify
          # Track the immutable per-commit tag (werify CI pushes `main-<shortsha>`)
          # instead of the mutable `:main`, so the deployed ref — and thus the
          # deploy notification — carries the source commit. `latest` = newest by
          # build time among tags matching allowTags. Overrides the CR-wide
          # `updateStrategy: digest` default.
          imageName: ghcr.io/prem-prakash/werify
          updateStrategy: latest
          allowTags: "^main-[0-9a-f]{7,}$"
    - namePattern: "werify-staging"
      images:
        - alias: werify
          # Mirror of werify-production: track the immutable `staging-<shortsha>`
          # tag so staging deploy notifications also show the source commit.
          imageName: ghcr.io/prem-prakash/werify
          updateStrategy: latest
          allowTags: "^staging-[0-9a-f]{7,}$"
    - namePattern: "iddh-members-staging"
      images:
        - alias: iddh-members
          # Mirror: track immutable `staging-<shortsha>` tags.
          imageName: ghcr.io/iddh-com-br/members
          updateStrategy: latest
          allowTags: "^staging-[0-9a-f]{7,}$"
