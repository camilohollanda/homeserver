# ImageUpdater CR to watch for new images and update ArgoCD Applications
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: werify-image-updater
  namespace: argocd
spec:
  namespace: argocd
  commonUpdateSettings:
    updateStrategy: digest
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: "iddh-members-production"
      images:
        - alias: members
          # Mirrors werify-production: CI moves :main only after a successful build, so digest
          # tracking makes that environment tag the explicit promotion pointer and moving it back
          # to an existing main-<shortsha> artifact performs a rollback without rebuilding.
          # Unlike newest-build, this never infers deploy order from the image's cache-sensitive
          # internal creation timestamp.
          imageName: ghcr.io/iddh-com-br/members:main
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: "werify-production"
      images:
        - alias: werify
          # CI moves :main only after a successful build. Digest tracking makes that
          # environment tag the explicit promotion pointer, so moving it back to an
          # existing main-<shortsha> artifact performs a rollback without rebuilding.
          # Unlike newest-build, this never infers deploy order from the image's
          # cache-sensitive internal creation timestamp.
          imageName: ghcr.io/prem-prakash/werify:main
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: "werify-staging"
      images:
        - alias: werify
          # Mirror of production: CI (or the manual app promotion workflow) moves
          # :staging to the desired immutable artifact; the digest change rolls it.
          imageName: ghcr.io/prem-prakash/werify:staging
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: "iddh-members-staging"
      images:
        - alias: iddh-members
          # Mirror of iddh-members-production: CI (or the manual "Deploy members app" workflow)
          # moves :staging to the desired immutable artifact; the digest change rolls it.
          imageName: ghcr.io/iddh-com-br/members:staging
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: "werify-connector-production"
      images:
        - alias: connector
          # The connector runs the same werify image, but is deployed DELIBERATELY (a singleton
          # whatsmeow session that should rarely restart), so it does NOT follow the `main-<sha>`
          # stream the app does. Instead, digest-track a dedicated `:connector-production` tag that
          # is moved only by the werify "Deploy WhatsApp connector" workflow — image-updater then
          # rolls the connector Application when that tag's digest changes (auto-roll, no kubectl).
          # App builds move `main-<sha>` / `:main`, never `:connector-production`, so merges to main
          # STILL never restart the connector — the pod-split decoupling holds.
          # (digest strategy tracks the tag embedded in imageName; allowTags is unused for digest.)
          imageName: ghcr.io/prem-prakash/werify:connector-production
          commonUpdateSettings:
            updateStrategy: digest
    - namePattern: "werify-connector-staging"
      images:
        - alias: connector
          # Mirror of werify-connector-production: digest-track the dedicated `:connector-staging`
          # tag (moved only by the "Deploy WhatsApp connector" workflow). See the production entry.
          imageName: ghcr.io/prem-prakash/werify:connector-staging
          commonUpdateSettings:
            updateStrategy: digest
