# Registry credentials used by Argo CD Image Updater when an application is
# switched from GHCR to the Forgejo registry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-image-updater
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: forgejo
    kind: ClusterSecretStore
  target:
    name: forgejo-image-updater
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        creds: "{{ .FORGEJO_REGISTRY_USER }}:{{ .FORGEJO_REGISTRY_TOKEN }}"
  data:
    - secretKey: FORGEJO_REGISTRY_USER
      remoteRef:
        key: FORGEJO_REGISTRY_USER
    - secretKey: FORGEJO_REGISTRY_TOKEN
      remoteRef:
        key: FORGEJO_REGISTRY_TOKEN
