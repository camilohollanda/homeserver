apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: umami
  name: umami
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umami
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: umami
    spec:
      containers:
      - name: umami
        # Umami v3 ships a single image — the DB flavour is inferred from
        # DATABASE_URL, so there is no `postgresql-` tag prefix any more.
        image: ghcr.io/umami-software/umami:3.2.0
        ports:
        - containerPort: 3000
          name: http
        # Umami runs `prisma migrate deploy` on boot. A cold start against an
        # empty database takes noticeably longer than a normal restart, hence
        # the startup probe — liveness only takes over once that has passed.
        startupProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/heartbeat
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
        # DATABASE_URL + APP_SECRET, from Infisical /Umami/ via ESO.
        envFrom:
        - secretRef:
            name: umami-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "768Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: umami
  namespace: umami
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: umami
