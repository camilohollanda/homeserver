# =============================================================================
# ClusterSecretStores for the Werify WhatsApp connector
# Pulls secrets from Infisical project "homeserver", path "/WerifyConnector/"
#
# Separate from werify-cluster-secret-store.yaml (path "/Werify/") on purpose. The pod split
# gave the connector its own Deployment but not its own secret: both pods mounted the same
# `secrets`, so the Go connector carried the app's entire environment — Asaas and OpenAI keys,
# SECRET_KEY_BASE, the MFA encryption key, the evidence A1 signing certificate and its
# password, BRy and Google credentials — while reading about a dozen variables, none of them
# those. A process whose job is holding sockets open to WhatsApp's CDN could read every
# credential the product has, including the one used to sign court evidence.
#
# Same Infisical project and same machine identity as the app; only the path differs. That is
# what scopes the connector's environment down to its own variables.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: werify-connector-staging
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: staging
        secretsPath: "/WerifyConnector/"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: werify-connector-production
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: prod
        secretsPath: "/WerifyConnector/"
