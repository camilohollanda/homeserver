# =============================================================================
# ClusterSecretStores for iddh-members
# Pulls secrets from Infisical project "homeserver", path "/Iddh-members/"
# Add your secrets in Infisical under: prod → /Iddh-members/
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: iddh-members-production
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: prod
        secretsPath: "/Iddh-members/"

---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: iddh-members-staging
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: staging
        secretsPath: "/Iddh-members/"
