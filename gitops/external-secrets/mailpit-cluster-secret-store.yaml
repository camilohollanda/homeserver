# ClusterSecretStore for Mailpit. The existing credentials in Infisical are
# reused so applications do not need any SMTP configuration changes.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mailpit
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: prod
        secretsPath: "/mailpit/"
