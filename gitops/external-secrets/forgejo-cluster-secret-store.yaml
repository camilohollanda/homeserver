# Shared Forgejo credentials used by Argo CD, Image Updater and workload
# namespaces. The values live in Infisical project homeserver at /Forgejo/.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: forgejo
spec:
  provider:
    infisical:
      hostAPI: https://infisical.internal.prakash.com.br
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-credentials
            namespace: external-secrets
            key: clientId
          clientSecret:
            name: infisical-credentials
            namespace: external-secrets
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-1jj1
        environmentSlug: prod
        secretsPath: "/Forgejo/"
