apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-keys
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: plane
    kind: ClusterSecretStore
  target:
    name: plane-keys
    creationPolicy: Owner
  data:
  - secretKey: SECRET_KEY
    remoteRef:
      key: SECRET_KEY
  - secretKey: LIVE_SERVER_SECRET_KEY
    remoteRef:
      key: LIVE_SERVER_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-env
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: plane
    kind: ClusterSecretStore
  target:
    name: plane-app-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: '{{ .DATABASE_URL }}'
        AMQP_URL: amqp://plane:{{ .RABBITMQ_PASSWORD }}@plane-rabbitmq.plane.svc.cluster.local:5672/
        REDIS_URL: redis://plane-redis.plane.svc.cluster.local:6379/0
        ENABLE_SIGNUP: '0'
        GUNICORN_WORKERS: '1'
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: DATABASE_URL
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: RABBITMQ_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-live-env
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: plane
    kind: ClusterSecretStore
  target:
    name: plane-live-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: redis://plane-redis.plane.svc.cluster.local:6379/0
  data:
  - secretKey: LIVE_SERVER_SECRET_KEY
    remoteRef:
      key: LIVE_SERVER_SECRET_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-rabbitmq
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: plane
    kind: ClusterSecretStore
  target:
    name: plane-rabbitmq
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RABBITMQ_DEFAULT_USER: plane
        RABBITMQ_DEFAULT_PASS: '{{ .RABBITMQ_PASSWORD }}'
  data:
  - secretKey: RABBITMQ_PASSWORD
    remoteRef:
      key: RABBITMQ_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-storage
  namespace: plane
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: plane
    kind: ClusterSecretStore
  target:
    name: plane-storage
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: '{{ .AWS_ACCESS_KEY_ID }}'
        AWS_SECRET_ACCESS_KEY: '{{ .AWS_SECRET_ACCESS_KEY }}'
        AWS_S3_ENDPOINT_URL: https://garage.internal.prakash.com.br
        # Plane's expired-export cleanup omits endpoint_url when USE_MINIO=0.
        # Botocore uses this override for clients without an explicit endpoint.
        AWS_ENDPOINT_URL_S3: https://garage.internal.prakash.com.br
        AWS_REGION: garage
        AWS_S3_BUCKET_NAME: plane
        USE_MINIO: '0'
        FILE_SIZE_LIMIT: '10485760'
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: AWS_ACCESS_KEY_ID
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: AWS_SECRET_ACCESS_KEY
