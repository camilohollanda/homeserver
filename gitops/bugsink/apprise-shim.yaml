apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise-shim
  namespace: bugsink
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apprise-shim
  template:
    metadata:
      labels:
        app: apprise-shim
    spec:
      containers:
        - name: shim
          image: python:3.13-alpine
          command: ["python", "/scripts/shim.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APPRISE_URL
              value: http://apprise.apprise.svc.cluster.local
            - name: APPRISE_KEY
              value: homeserver
            - name: TAG_FALLBACK
              value: bugsink
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: script
          configMap:
            name: apprise-shim-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: apprise-shim
  namespace: bugsink
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: apprise-shim
