apiVersion: v1
kind: ConfigMap
metadata:
  name: apprise-shim-script
  namespace: bugsink
data:
  shim.py: |
    #!/usr/bin/env python3
    """Translate Bugsink Slack-format webhooks into Apprise JSON POSTs.

    POST /hook/<tag>  -> Apprise /notify/<APPRISE_KEY>  (body.tag = <tag>)
    Apprise holds the destination credentials and per-tag URL routing.
    """
    import json
    import logging
    import os
    import re
    import sys
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    APPRISE_URL = os.environ["APPRISE_URL"].rstrip("/")
    APPRISE_KEY = os.environ.get("APPRISE_KEY", "homeserver")
    TAG_FALLBACK = os.environ.get("TAG_FALLBACK", "bugsink")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "8080"))

    TAG_RE = re.compile(r"^[a-zA-Z0-9_-]{1,64}$")

    logging.basicConfig(
        level=logging.INFO,
        format="%(asctime)s %(levelname)s %(message)s",
        stream=sys.stdout,
    )
    log = logging.getLogger("shim")

    COLOR_TO_TYPE = {
        "danger": "failure", "#e01e5a": "failure", "#ff0000": "failure",
        "warning": "warning", "#ffcc00": "warning",
        "good": "success", "#36a64f": "success",
    }

    LINK_RE = re.compile(r"<([^|>]+)\|([^>]*)>")
    HEADER_PREFIX_RE = re.compile(r"^#+\s*")
    MRKDWN_FIELD_RE = re.compile(r"^\*([^*]+)\*\s*:\s*(.+)$", re.DOTALL)

    def _strip_md_link(text: str) -> str:
        return LINK_RE.sub(lambda m: m.group(2) or m.group(1), text or "")

    def _first_link(text: str) -> str:
        m = LINK_RE.search(text or "")
        return m.group(1) if m else ""

    def _clean_title(text: str) -> str:
        return HEADER_PREFIX_RE.sub("", (text or "").strip())

    def _collect_fields(payload: dict) -> dict:
        # Bugsink's mattermost backend puts {title, value} pairs in attachments[*].fields;
        # the slack backend puts "*key*: value" mrkdwn strings in blocks[*].fields.
        fields = {}
        for attachment in payload.get("attachments") or []:
            for f in attachment.get("fields") or []:
                name = (f.get("title") or "").strip().lower()
                value = (f.get("value") or "").strip()
                if name and value:
                    fields[name] = value
        for block in payload.get("blocks") or []:
            for f in block.get("fields") or []:
                m = MRKDWN_FIELD_RE.match((f.get("text") or "").strip())
                if not m:
                    continue
                name = m.group(1).strip().lower()
                value = m.group(2).strip()
                if name and value:
                    fields[name] = value
        return fields

    def translate(payload: dict, tag: str) -> dict:
        attachment = (payload.get("attachments") or [{}])[0]
        blocks = payload.get("blocks") or []

        # Issue title: payload.text on the mattermost backend is "### <title>";
        # on the slack backend it's the plain title; fall back to the header block.
        raw_title = payload.get("text")
        if not raw_title:
            for b in blocks:
                if b.get("type") == "header":
                    raw_title = (b.get("text") or {}).get("text")
                    break
        raw_title = raw_title or attachment.get("title") or "Bugsink alert"
        issue_title = _strip_md_link(_clean_title(raw_title))

        # Alert reason ("new issue", "unmute issue", ...) lives in attachment.title
        # for mattermost, or in the second section block for slack.
        alert_reason = attachment.get("title") or ""
        if not alert_reason:
            for b in blocks[1:]:
                t = b.get("text")
                if b.get("type") == "section" and isinstance(t, dict):
                    alert_reason = (t.get("text") or "").strip()
                    if alert_reason:
                        break

        fields = _collect_fields(payload)
        project = fields.get("project")
        environment = fields.get("environment")
        release = fields.get("release")

        link = _first_link(attachment.get("text") or "")
        if not link:
            for b in reversed(blocks):
                t = b.get("text")
                if isinstance(t, dict):
                    cand = _first_link(t.get("text") or "")
                    if cand:
                        link = cand
                        break
        if not link:
            link = attachment.get("title_link") or ""

        prefix_bits = [p for p in (project, environment) if p]
        prefix = f"[{' / '.join(prefix_bits)}] " if prefix_bits else ""
        title = (prefix + issue_title).strip()

        body_lines = []
        if alert_reason:
            body_lines.append(alert_reason)
        if release:
            body_lines.append(f"release: {release}")
        if link:
            body_lines.append(f"[View issue]({link})")
        body = "\n\n".join(body_lines) or issue_title

        ntype = COLOR_TO_TYPE.get((attachment.get("color") or "").lower(), "info")

        return {
            "title": title,
            "body": body,
            "tag": tag,
            "type": ntype,
            "format": "markdown",
        }

    def publish(apprise_payload: dict) -> None:
        req = urllib.request.Request(
            f"{APPRISE_URL}/notify/{APPRISE_KEY}",
            data=json.dumps(apprise_payload).encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            resp.read()

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            log.info("%s - %s", self.address_string(), fmt % args)

        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def do_POST(self):
            parts = [p for p in self.path.split("/") if p]
            if not parts or parts[0] != "hook":
                if self.path != "/":
                    self.send_response(404)
                    self.end_headers()
                    return
                tag = TAG_FALLBACK
            elif len(parts) == 1:
                tag = TAG_FALLBACK
            elif len(parts) == 2 and TAG_RE.match(parts[1]):
                tag = parts[1]
            else:
                self.send_response(400)
                self.end_headers()
                return
            length = int(self.headers.get("Content-Length") or 0)
            raw = self.rfile.read(length) if length else b"{}"
            try:
                payload = json.loads(raw or b"{}")
            except json.JSONDecodeError as exc:
                log.warning("bad json: %s", exc)
                self.send_response(400)
                self.end_headers()
                return
            apprise_payload = translate(payload, tag)
            try:
                publish(apprise_payload)
            except Exception as exc:
                log.exception("apprise publish failed: %s", exc)
                self.send_response(502)
                self.end_headers()
                return
            log.info("forwarded tag=%s title=%r", tag, apprise_payload["title"])
            self.send_response(204)
            self.end_headers()

    if __name__ == "__main__":
        log.info(
            "shim listening on :%d -> %s/notify/%s (fallback tag=%s)",
            LISTEN_PORT, APPRISE_URL, APPRISE_KEY, TAG_FALLBACK,
        )
        ThreadingHTTPServer(("0.0.0.0", LISTEN_PORT), Handler).serve_forever()
