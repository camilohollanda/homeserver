apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: bugsink
  name: bugsink
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugsink
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bugsink
    spec:
      containers:
      - name: bugsink
        # Official image. The fork existed to carry PR bugsink/bugsink#396 (the
        # /envelope/ + /store/ JsonResponse fix) before it was upstream; #396
        # merged on 2026-06-04 and shipped in 2.3.0, so the fork has nothing left
        # to add. Its build workflow also tracked the fork's main rather than the
        # commit it was tagged from, which is how a tag named after a June commit
        # ended up serving code from 2026-05-13 -- older than #396 itself.
        #
        # Pinned, not :latest. ArgoCD syncs this path with selfHeal, so a floating
        # tag would make what runs depend on when a pod last restarted instead of
        # on what is in git.
        image: bugsink/bugsink:2.5.0
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: bugsink.internal.prakash.com.br
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8000
            httpHeaders:
            - name: Host
              value: bugsink.internal.prakash.com.br
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        envFrom:
        - secretRef:
            name: bugsink-secrets
        env:
        - name: PORT
          value: "8000"
        - name: BEHIND_HTTPS_PROXY
          value: "true"
        # Apprise-shim is reachable only on the k3s service CIDR (10.43.0.0/16),
        # which bugsink's non-global IP guard rejects. The allow list does NOT
        # bypass that guard (see alerts/service_backends/webhook_security.py),
        # so we have to disable it outright.
        - name: ALERTS_WEBHOOK_DENY_NON_GLOBAL
          value: "false"
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bugsink-data
---
apiVersion: v1
kind: Service
metadata:
  name: bugsink
  namespace: bugsink
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: bugsink
