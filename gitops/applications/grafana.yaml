apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/camilohollanda/homeserver.git
    targetRevision: main
    path: gitops/grafana
  destination:
    server: https://kubernetes.default.svc
    namespace: grafana
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Server-side apply is NOT set here on purpose. The dashboards ConfigMap
    # needs it and asks for it itself, through a sync-option annotation in
    # gitops/grafana/kustomization.yaml. Turning it on for the whole app also
    # turns it on for the ExternalSecret, where it surfaces the deletionPolicy
    # the CRD defaults in as permanent drift.
