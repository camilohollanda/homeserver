apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: werify-connector-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/camilohollanda/homeserver.git
    targetRevision: main
    path: gitops/production/werify-connector
  destination:
    server: https://kubernetes.default.svc
    namespace: werify-production
  # Its own Application. image-updater tracks it (see the werify-connector-production entry in the
  # ImageUpdater CR) but only by the DIGEST of the dedicated `:connector-production` tag, which app
  # builds never move — so a merge to main (which image-updater rolls onto the werify-production app
  # Deployment) bumps only the app, never the connector. A deliberate promote of that tag is the
  # only thing that rolls it. That decoupling is the whole point of the split.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace: the werify-production app owns werify-production (and the secrets in it).
