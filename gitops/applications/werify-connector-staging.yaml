apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: werify-connector-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/prem-prakash/homeserver.git
    targetRevision: main
    path: gitops/staging/werify-connector
  destination:
    server: https://kubernetes.default.svc
    namespace: werify-staging
  # Its own Application. image-updater tracks it (see the werify-connector-staging entry in the
  # ImageUpdater CR) but only by the DIGEST of the dedicated `:connector-staging` tag, which app
  # builds never move — so `main` merges (staging builds) bump only the app Deployment's image,
  # never the connector's. A deliberate promote of that tag is the only thing that rolls it.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # No CreateNamespace: the werify-staging app owns werify-staging (and the secrets in it).
