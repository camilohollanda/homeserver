apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: grafana
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        # Pinned, like every other third-party image here. On `latest` this
        # deployment silently adopted whatever Grafana had published on each
        # restart, which is how the memory limit below went from comfortable in
        # January to OOMKilling the pod five times in eight days without a
        # commit in this repo to point at. `latest` also defaulted the pull
        # policy to Always -- a pinned tag defaults to IfNotPresent, stated here
        # rather than left implied.
        image: grafana/grafana:13.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: admin-password
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboard-provisioning
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        - name: alerting
          mountPath: /etc/grafana/provisioning/alerting
          readOnly: true
        # 512Mi was set in January and stopped being enough somewhere around
        # Grafana 13. The working set peaked at 504Mi on 2026-08-26 and 492Mi on
        # 2026-08-30 against that ceiling, OOMKilling the pod five times in the
        # eight days to 2026-08-30. 1Gi is roughly twice the observed peak.
        # Note this drifts on its own: the image is `latest` with pullPolicy
        # Always, so every restart adopts whatever Grafana has published and the
        # baseline creeps up with no commit here to point at.
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboard-provisioning
        configMap:
          name: grafana-dashboard-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards
      # Contact point and rules are separate ConfigMaps -- they have different
      # lifecycles and the contact point is verifiable on its own -- but Grafana
      # expects one provisioning directory, so they are projected together.
      - name: alerting
        projected:
          sources:
            - configMap:
                name: grafana-alerting-contactpoints
            - configMap:
                name: grafana-alerting-rules
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: grafana
