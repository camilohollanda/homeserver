apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - external-secret.yaml
  - datasources.yaml
  - dashboard-provisioning.yaml
  - alerting-contactpoints.yaml
  - alerting-rules.yaml
  - deployment.yaml
  - ingress.yaml

# Generate ConfigMap from dashboard JSON files
configMapGenerator:
  - name: grafana-dashboards
    namespace: grafana
    files:
      - dashboards/k8s-overview.json
      - dashboards/werify-production.json
      - dashboards/werify-staging.json
      - dashboards/whisper-api.json
      - dashboards/iddh-members-production.json
      - dashboards/iddh-members-staging.json
      - dashboards/pod-resources.json
      - dashboards/pod-resources-detail.json
      - dashboards/vm-hosts.json
      - dashboards/disk-io.json
      - dashboards/postgres.json
      - dashboards/garage.json
      - dashboards/infisical.json
      - dashboards/services-nginx.json
      - dashboards/gh-runners.json
    options:
      disableNameSuffixHash: true
      annotations:
        # This ConfigMap passed 262,144 bytes on 2026-08-30 and can no longer
        # be applied client-side: `kubectl apply` keeps a copy of the whole
        # object in the last-applied-configuration annotation, and annotations
        # are capped there. The ConfigMap itself is fine, at about a quarter of
        # its own 1 MiB limit -- only the way it was applied was not. Scoped to
        # this resource rather than set on the Application, because server-side
        # apply makes the ExternalSecret's CRD-defaulted deletionPolicy read as
        # permanent drift.
        argocd.argoproj.io/sync-options: ServerSideApply=true
