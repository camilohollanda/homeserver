apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - external-secret.yaml
  - datasources.yaml
  - dashboard-provisioning.yaml
  - alerting-contactpoints.yaml
  - alerting-rules.yaml
  - deployment.yaml
  - ingress.yaml

# Generate ConfigMap from dashboard JSON files
configMapGenerator:
  - name: grafana-dashboards
    namespace: grafana
    files:
      - dashboards/k8s-overview.json
      - dashboards/werify-production.json
      - dashboards/werify-connector-production.json
      - dashboards/werify-staging.json
      - dashboards/werify-connector-staging.json
      - dashboards/whisper-api.json
      - dashboards/iddh-members-production.json
      - dashboards/iddh-members-staging.json
      - dashboards/pod-resources.json
      # Layout candidates for the pod-resources rewrite -- all five are
      # provisioned side by side so the layouts can be compared against live
      # data. Delete the losers (and this block) once one is picked.
      - dashboards/pod-resources-a-triage.json
      - dashboards/pod-resources-b-namespaces.json
      - dashboards/pod-resources-c-layered.json
      - dashboards/pod-resources-d-fleet.json
      - dashboards/pod-resources-d-detail.json
      - dashboards/vm-hosts.json
      - dashboards/garage.json
      - dashboards/infisical.json
      - dashboards/services-nginx.json
    options:
      disableNameSuffixHash: true
