apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.loki:3100
        isDefault: true
        editable: false
      - name: VictoriaMetrics
        uid: victoria-metrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.victoria-metrics:8428
        editable: false
        jsonData:
          httpMethod: POST
          timeInterval: 30s
