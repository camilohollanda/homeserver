# vmsingle's embedded scraper uses Kubernetes service discovery (role: node)
# to find kubelets, then proxies through the apiserver to reach each node's
# /metrics/cadvisor endpoint. The SA needs list+get on nodes + nodes/proxy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: victoria-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics
subjects:
  - kind: ServiceAccount
    name: victoria-metrics
    namespace: victoria-metrics
