apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape
  namespace: victoria-metrics
data:
  # Single scrape config: kubelet cAdvisor for per-container metrics
  # (container_cpu_usage_seconds_total, container_memory_working_set_bytes,
  # container_spec_memory_limit_bytes, ...). Reached through the apiserver
  # proxy so we don't need to know each node's IP/cert.
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s

    scrape_configs:
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # Same again for the node-level kubelet metrics (kubelet_*).
      - job_name: kubernetes-kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      # node_exporter on the VMs and on the hypervisor. Pull, not push: pods in
      # this cluster reach the LAN directly, so there is no need for a vmagent
      # per host or a NodePort. Promtail pushes only because Loki has no pull
      # model. The `host` label deliberately mirrors the label promtail writes
      # into Loki, so a metric and its logs share one key.
      - job_name: node-exporter
        static_configs:
          - targets: ['192.168.20.10:9100']
            labels: {host: proxmox}
          - targets: ['192.168.20.11:9100']
            labels: {host: k3s-apps}
          - targets: ['192.168.20.22:9100']
            labels: {host: services}
          - targets: ['192.168.20.23:9100']
            labels: {host: pg18}
          - targets: ['192.168.20.30:9100']
            labels: {host: ai-gpu}
          - targets: ['192.168.20.40:9100']
            labels: {host: media}
          - targets: ['192.168.20.50:9100']
            labels: {host: gh-runners}

      # postgres_exporter on the database VM. One job, one target: this is the
      # only database host, and the exporter runs without
      # --auto-discover-databases, so a single connection reports the whole
      # cluster through pg_stat_database. The `host` label matches the
      # node-exporter one so a Postgres graph and its host graph share a key.
      - job_name: postgres-exporter
        static_configs:
          - targets: ['192.168.20.23:9187']
            labels: {host: pg18}
        # No metric_relabel_configs. Most of what this exporter publishes is
        # pg_settings_*, ~700 gauges mirroring postgresql.conf, and dropping
        # all but max_connections would need a negative lookahead that RE2 does
        # not have -- so it would take a rename plus a blanket drop. For 0.7% of
        # the 96k series already stored, that is not a trade worth making, and
        # an invalid relabel rule takes down every job in this file, not just
        # this one.
