apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: pdf-production
  name: pdf
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Stateless → horizontally scalable. Keep per-pod Chrome concurrency low
  # (RENDER_MAX_CONCURRENCY) and add replicas for throughput.
  replicas: 1
  selector:
    matchLabels:
      app: pdf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdf
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: pdf
        image: ghcr.io/prem-prakash/werify_pdf_renderer:main
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        env:
        # Image USER is `nobody` whose default HOME is /nonexistent. Chrome's
        # crashpad helper derives its --database path from $HOME and dies with
        # "--database is required" if it isn't writable, taking the whole BEAM
        # with it (surfaces as ChromicPDF.Connection.ConnectionLostError).
        # /tmp is mounted writable below.
        - name: HOME
          value: /tmp
        envFrom:
        # All app env (PHX_SERVER, PORT, PHX_HOST, RENDER_MAX_CONCURRENCY,
        # RENDER_TIMEOUT_SECONDS, SECRET_KEY_BASE, RENDER_TOKEN) comes from
        # Infisical via the ExternalSecret.
        - secretRef:
            name: secrets
        startupProbe:
          # Warm Chrome pool needs time on first boot.
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 15
          timeoutSeconds: 3
        volumeMounts:
        # USER nobody's $HOME is /nonexistent; HOME is set to /tmp above so
        # Chrome/ChromicPDF (and the crashpad helper) have a writable location
        # for cache, crash dumps, and shared memory (the app launches Chrome
        # with --disable-dev-shm-usage, so shm goes to /tmp too).
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            # Chromium is bursty/memory-hungry; tune against real conversation HTML.
            memory: "3Gi"
            cpu: "2"
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pdf
  namespace: pdf-production
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: pdf
