apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: pdf-production
  name: pdf
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  # Stateless → horizontally scalable. Keep per-pod Chrome concurrency low
  # (RENDER_MAX_CONCURRENCY) and add replicas for throughput.
  replicas: 1
  # A new pod's readiness probe passes the instant /health returns 200, but the
  # EndpointSlice/kube-proxy update (and teardown of the old pod) lag that by a
  # few seconds. Without minReadySeconds the pod counts as "available" at probe
  # success, so Argo CD flips to Healthy — and fires the on-deployed Pushover —
  # before traffic actually routes to the new pod. Requiring 10s of continuous
  # readiness holds Argo CD in Progressing until the rollout has settled, so the
  # "Deployed" ping lands when the pod is genuinely serving.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: pdf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pdf
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: pdf
        image: ghcr.io/prem-prakash/werify_pdf_renderer:main
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        env:
        # Image USER is `nobody` whose default HOME is /nonexistent. Chrome's
        # crashpad helper derives its --database path from $HOME and dies with
        # "--database is required" if it isn't writable, taking the whole BEAM
        # with it (surfaces as ChromicPDF.Connection.ConnectionLostError).
        # /tmp is mounted writable below.
        - name: HOME
          value: /tmp
        envFrom:
        # All app env (PHX_SERVER, PORT, PHX_HOST, RENDER_MAX_CONCURRENCY,
        # RENDER_TIMEOUT_SECONDS, SECRET_KEY_BASE, RENDER_TOKEN) comes from
        # Infisical via the ExternalSecret.
        - secretRef:
            name: secrets
        startupProbe:
          # Warm Chrome pool needs time on first boot.
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 15
          timeoutSeconds: 3
        volumeMounts:
        # USER nobody's $HOME is /nonexistent; HOME is set to /tmp above so
        # Chrome/ChromicPDF (and the crashpad helper) have a writable location
        # for cache, crash dumps, and shared memory (the app launches Chrome
        # with --disable-dev-shm-usage, so shm goes to /tmp too).
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: "1Gi"
            cpu: "250m"
          limits:
            # Chromium is bursty/memory-hungry. 3Gi was OOMKilled rendering
            # large (40MB+) conversation HTML; 6Gi matches gotenberg's proven
            # sizing for similar PDF/A workloads (per upstream README's hint).
            memory: "6Gi"
            cpu: "2"
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pdf
  namespace: pdf-production
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: pdf
