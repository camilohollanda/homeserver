apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: werify-production
  name: werify
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: werify
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: werify
    spec:
      imagePullSecrets:
      - name: ghcr-credentials
      containers:
      - name: werify
        image: ghcr.io/prem-prakash/werify:main
        imagePullPolicy: Always
        ports:
        - containerPort: 4000
          name: http
        startupProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          periodSeconds: 10
          timeoutSeconds: 3
        env:
        - name: DNS_CLUSTER_QUERY
          value: cluster.werify-production.svc.cluster.local
        # Connector pod split (production): the connector runs in its own Deployment
        # (werify-connector), so the app must NOT spawn a second in-pod connector — the whatsmeow
        # session is single-owner — and it talks to the pod over the DB transport. These override
        # whatever the Infisical secret carries (env wins over envFrom).
        - name: WHATSAPP_SIDECAR_ENABLED
          value: "false"
        - name: SIDECAR_MODE
          value: "db"
        envFrom:
        - secretRef:
            name: secrets
        volumeMounts:
        - name: data
          mountPath: /app/priv
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            # Typst PDF/A rendering peaks at ~1.5 GiB working-set on large
            # conversation docs; cgroup OOM killer hit at 2 GiB. 4 GiB gives
            # 2× headroom for transient spikes and concurrent renders.
            memory: "4Gi"
            # Typst PDF/A rendering is CPU-bound and pegged the 2-core limit
            # (a single large laudo.pdf took ~320s wall-clock). 4 cores gives
            # the layout + image/PDF encoding more parallelism to cut latency;
            # node has 8 cores allocatable.
            cpu: "4"
        # A deploy races the ingress: EndpointSlice removal and SIGTERM are
        # concurrent and unordered, so when SIGTERM makes Phoenix drain its
        # LiveView sockets (WS close 1012), ingress-nginx may still be routing
        # here. The browser retries 10ms after that close — far faster than the
        # ingress reacts — lands on the dying pod and gets a 502. That 502 pushes
        # the socket onto its longpoll fallback, where it wedges: no further
        # connect attempt, ever, so the page looks frozen (every phx-click inert)
        # until a manual reload. Sleeping before SIGTERM lets the endpoint
        # removal land first. Validated on staging: recovery went from never to
        # 700ms.
        lifecycle:
          preStop:
            sleep:
              seconds: 10
      # Covers preStop (10s) *plus* the BEAM shutdown after SIGTERM. The implicit
      # 30s default would leave only 20s to drain Oban and sockets — less than the
      # app has today.
      terminationGracePeriodSeconds: 45
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: werify-data
---
apiVersion: v1
kind: Service
metadata:
  name: werify
  namespace: werify-production
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: werify
---
apiVersion: v1
kind: Service
metadata:
  name: cluster
  namespace: werify-production
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: werify
