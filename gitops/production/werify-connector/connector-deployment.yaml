# WhatsApp connector, split into its own pod (Phase 2 of docs/whatsapp-connector-pod-split.md in
# the werify repo) — production. Same image as the app (the Go binary ships at
# /app/bin/whatsapp-sidecar), run with a different command and SIDECAR_MODE=db, so it talks to the
# app over the whatsapp_events / whatsapp_commands tables + LISTEN/NOTIFY instead of a BEAM Port.
#
# Its own Deployment + ArgoCD Application (werify-connector-production), NOT tracked by
# argocd-image-updater — so a merge to main (which image-updater rolls onto the app Deployment)
# never restarts this connector. That is exactly what stops the ~15/day deploy-driven companion
# reconnects that trip WhatsApp's anti-automation enforcement (the whole point of the split).
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: werify-production
  name: werify-connector
  # Deliberately NO reloader.stakater.com/auto: a secret rotation must not restart the connector
  # (decoupling it from that churn is the point). Roll it manually when its config truly changes:
  #   kubectl rollout restart deployment/werify-connector -n werify-production
spec:
  replicas: 1
  # The whatsmeow companion session is single-owner (one active socket per device), so two
  # connector pods must never run at once. Recreate terminates the old pod before starting the new
  # — unlike the app's RollingUpdate, which would briefly run two that fight over the socket.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: werify-connector
  template:
    metadata:
      labels:
        app: werify-connector
    spec:
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: connector
          # Dedicated :connector-production tag, moved only by a deliberate promote (the "Deploy
          # WhatsApp connector" workflow in the werify repo re-points it at a chosen build).
          # image-updater digest-tracks this tag (its CR entry) and rolls the pod when the digest
          # changes — so a promote auto-deploys, no kubectl. App merges move :main, never
          # :connector-production, so they never touch it. image-updater pins the resolved digest,
          # so an involuntary restart re-pulls the SAME image, never jumps to latest main.
          image: ghcr.io/prem-prakash/werify:connector-production
          imagePullPolicy: Always
          command: ["/app/bin/whatsapp-sidecar"]
          env:
            - name: SIDECAR_MODE
              value: "db"
            # Structured JSON logs to stdout for Loki / the connector Grafana dashboard.
            - name: SIDECAR_LOG_FORMAT
              value: json
            - name: SIDECAR_LOG_LEVEL
              value: info
            # Socket-free liveness signal: the connector rewrites this file every ~10s; the probe
            # below restarts the pod if it goes stale (the hard-wedge case k8s must catch, since a
            # wedged connector won't drain the recycle command either).
            - name: WHATSAPP_SIDECAR_HEARTBEAT_FILE
              value: /run/whatsapp-connector/heartbeat
            # The Go runtime cannot see a cgroup limit on its own: with GOGC at its default 100 it
            # targets ~2x the live heap before collecting, so at ~500Mi live it aimed for ~1Gi
            # against a 768Mi ceiling and the kernel killed it first — the exact mechanism of the
            # 2026-08-29 04:40 OOM. GOMEMLIMIT is a SOFT limit: approaching it makes the runtime
            # collect harder instead of growing, trading a kill for CPU. It is a guard rail, not a
            # cure — the cure is that memory scales with connected numbers (~4-5Mi per whatsmeow
            # client), which is what the limit below is sized for. See the werify repo's
            # docs/whatsapp-connector-memory.md.
            #
            # Held ~336Mi under limits.memory on purpose: GOMEMLIMIT bounds the Go heap, while the
            # cgroup also counts goroutine stacks, socket buffers and kernel memory.
            - name: GOMEMLIMIT
              value: "1200MiB"
          envFrom:
            # The connector's OWN secret (external-secret.yaml → Infisical /WerifyConnector/), not
            # the app's `secrets`. Carries SIDECAR_DATABASE_URL, WHATSAPP_SIDECAR_ALLOWLIST (=all in
            # production), WHATSAPP_MEDIA_RETRY_RECEIPT_INTERVAL_MS, ENVIRONMENT and
            # SIDECAR_SENTRY_DSN — and nothing else, so this pod no longer holds the app's Asaas /
            # OpenAI / signing-certificate credentials. SIDECAR_MODE above still overrides any value
            # the secret carries (env wins over envFrom).
            #
            # WHATSAPP_SIDECAR_ALLOWLIST is the one to watch: it is deny-by-default, so if it goes
            # missing the connector does not crash — it goes inert (no reconnect, no capture) while
            # the heartbeat keeps the liveness probe green. Verify the key is present in the new
            # secret before rolling, not after.
            - secretRef:
                name: connector-secrets
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "test $(( $(date +%s) - $(stat -c %Y /run/whatsapp-connector/heartbeat) )) -lt 30"
            # The heartbeat starts only after boot adoption (reconnectAll) finishes; give that room
            # so a healthy-but-slow boot isn't killed. A boot that actually hangs never writes it,
            # so it's restarted after the delay — which is the desired recovery.
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: heartbeat
              mountPath: /run/whatsapp-connector
          resources:
            requests:
              # The measured floor is ~500Mi at 79 connected numbers (2026-08-30), so the old 256Mi
              # request sat below actual usage and exposed the pod to eviction under node pressure.
              memory: "512Mi"
              cpu: "100m"
            limits:
              # No Typst / PDF rendering here (that's the app) — just whatsmeow sockets and JSON.
              # Sized off the measurement rather than the guess it replaces: memory tracks the
              # number of connected numbers at ~4-5Mi per whatsmeow client over a ~70Mi base, and
              # the base went from 3 numbers to 125 in ten days. At 768Mi that left room for ~30
              # more; 1.5Gi restores about a year of that growth rate. GOMEMLIMIT above keeps the
              # Go heap ~336Mi below this, leaving the difference for stacks, sockets and kernel.
              memory: "1536Mi"
              cpu: "1"
      volumes:
        - name: heartbeat
          emptyDir: {}
