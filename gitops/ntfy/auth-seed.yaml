apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-publishers
  namespace: ntfy
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: shared
    kind: ClusterSecretStore
  target:
    name: ntfy-publishers
    creationPolicy: Owner
  data:
    - secretKey: publisher-password
      remoteRef:
        key: NTFY_PUBLISHER_PASSWORD
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-auth-seed
  namespace: ntfy
data:
  # Seeds the single `publisher` user with write-only access to any topic.
  # Re-runs idempotently on every pod start.
  seed.sh: |
    #!/bin/sh
    set -eu

    : "${PUBLISHER_PASSWORD:?missing}"

    NTFY_PASSWORD="$PUBLISHER_PASSWORD" ntfy user add --ignore-exists publisher >/dev/null 2>&1 || true
    NTFY_PASSWORD="$PUBLISHER_PASSWORD" ntfy user change-pass publisher >/dev/null
    ntfy access publisher '*' write-only >/dev/null
    echo "seeded user: publisher (write-only on *)"
